name: Cluster CI

on:
  push:
  pull_request:

jobs:
  # Lint checks the source code before we spend time building/testing it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs Go on the GitHub runner.
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        working-directory: ./cluster
        run: go mod download

      - name: Run lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ./cluster

  # Builds the Go application.
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        working-directory: ./cluster
        run: go build ./...

  # Runs the test suite after the build job succeeds.
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        working-directory: ./cluster
        run: go test ./...

  # Builds the Docker image only after lint, build and tests succeed.
  # Runs only for pushes to the main branch.
  docker:
    needs:
      - lint
      - build
      - test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker is already available on ubuntu-latest.
      - name: Build Docker image
        working-directory: ./cluster
        run: |
          docker build \
            -t kubepilot:${{ github.sha }} \
            .
