name: KubePilot CI

on:
  push:
  pull_request:

jobs:
  # Lint checks the source code before we spend time building/testing it.
  lint:
    runs-on: ubuntu-latest

    steps:
      # Every job gets a fresh runner, so every job needs its own checkout.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs pnpm on the GitHub runner.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Installs Node.js and enables pnpm dependency caching.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Kubectl/pnpm-lock.yaml

      # pnpm does not have npm's "ci" command.
      # --frozen-lockfile makes sure the lockfile is not modified in CI.
      - name: Install dependencies
        working-directory: ./Kubectl
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: ./Kubectl
        run: pnpm run lint

  # Builds the TypeScript application.
  build:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Kubectl/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./Kubectl
        run: pnpm install --frozen-lockfile

      # This is your application build, NOT a Docker build.
      - name: Build application
        working-directory: ./Kubectl
        run: pnpm run build

  # Runs the test suite after the build job succeeds.
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Kubectl/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./Kubectl
        run: pnpm install --frozen-lockfile

      # Your tests should use the central test setup we discussed earlier.
      - name: Run tests
        working-directory: ./Kubectl
        run: pnpm run test

  # This builds the Docker image only after lint, build and tests succeed.
  # It runs only for pushes to the main branch.
  docker:
    needs:
      - lint
      - build
      - test

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker is already available on ubuntu-latest.
      - name: Build Docker image
        working-directory: ./Kubectl
        run: |
          docker build \
            -t kubepilot:${{ github.sha }} \
            .
